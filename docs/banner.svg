<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="AgentOps-X: see why your AI agent failed">
  <defs>
    <pattern id="retry" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#f0a63a"/>
      <rect width="5" height="10" fill="#f0a63a" opacity="0.55"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#0f1b2d" stop-opacity="1"/>
      <stop offset="0.12" stop-color="#0f1b2d" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="360" rx="16" fill="#0f1b2d"/>

  <!-- left: name and promise -->
  <text x="64" y="150" fill="#e7eef6" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="68" font-weight="600" letter-spacing="-1.5">AgentOps-X</text>
  <text x="66" y="200" fill="#8ea2bb" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="25">A flight recorder for AI agents.</text>
  <text x="66" y="234" fill="#8ea2bb" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="25">Every step, retry, token, dollar and GPU second.</text>
  <g font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#8ea2bb">
    <circle cx="72" cy="290" r="5" fill="#7fa8f5"/><text x="84" y="295">LLM call</text>
    <circle cx="172" cy="290" r="5" fill="#f0a63a"/><text x="184" y="295">retried</text>
    <circle cx="262" cy="290" r="5" fill="#ee6a64"/><text x="274" y="295">failed</text>
  </g>

  <!-- right: a trace waterfall, the product's signature view -->
  <g transform="translate(640 52)" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
    <rect x="0" y="0" width="584" height="256" rx="12" fill="#15253b" stroke="#263b55"/>
    <g fill="#5c718c">
      <text x="20" y="34">graph</text><text x="20" y="64">agent</text><text x="34" y="94">llm</text>
      <text x="20" y="124">tools</text><text x="20" y="154">tools, try 2</text><text x="20" y="184">tools, try 3</text>
      <text x="20" y="214">agent</text><text x="34" y="244">llm</text>
    </g>
    <g stroke="#263b55" stroke-dasharray="2 4">
      <line x1="140" x2="564" y1="29" y2="29"/><line x1="140" x2="564" y1="59" y2="59"/><line x1="140" x2="564" y1="89" y2="89"/>
      <line x1="140" x2="564" y1="119" y2="119"/><line x1="140" x2="564" y1="149" y2="149"/><line x1="140" x2="564" y1="179" y2="179"/>
      <line x1="140" x2="564" y1="209" y2="209"/><line x1="140" x2="564" y1="239" y2="239"/>
    </g>
    <rect x="140" y="22" width="424" height="14" rx="3" fill="#4d6889" opacity="0.6"/>
    <rect x="140" y="52" width="118" height="14" rx="3" fill="#4d6889"/>
    <rect x="146" y="82" width="108" height="14" rx="3" fill="#7fa8f5"/>
    <rect x="146" y="82" width="14" height="14" rx="3" fill="#ffffff" opacity="0.3"/>
    <rect x="262" y="112" width="34" height="14" rx="3" fill="#ee6a64"/>
    <rect x="318" y="142" width="40" height="14" rx="3" fill="#ee6a64"/>
    <rect x="384" y="172" width="30" height="14" rx="3" fill="url(#retry)"/>
    <rect x="420" y="202" width="140" height="14" rx="3" fill="#4d6889"/>
    <rect x="426" y="232" width="130" height="14" rx="3" fill="#7fa8f5"/>
    <rect x="426" y="232" width="16" height="14" rx="3" fill="#ffffff" opacity="0.3"/>
    <rect x="304" y="108" width="122" height="22" rx="11" fill="#0f1b2d" stroke="#ee6a64"/>
    <text x="365" y="124" fill="#ee6a64" font-size="12.5" text-anchor="middle">TimeoutError</text>
  </g>
</svg>
